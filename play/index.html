<script>
(function(){
  function patch(){
    var n=0;
    for(var i=0;i<document.styleSheets.length;i++){
      var rules; try{ rules=document.styleSheets[i].cssRules; }catch(e){ continue; }
      if(!rules) continue;
      for(var j=0;j<rules.length;j++){
        var r=rules[j];
        if(r.style && r.style.zIndex==='-1'){ r.style.zIndex='0'; n++; }
      }
    }
    return n;
  }
  var total=0, tries=0;
  var id=setInterval(function(){
    total+=patch(); tries++;
    if(total>0 || tries>20){
      clearInterval(id);
      if(total===0) console.warn('[ae] z-index:-1 の規則が見つからなかった。iOSで絵が消える対策が効いていない可能性がある。');
    }
  },120);
  patch();
})();
</script>

<script>
(function(){
  var K='amour-eternel:notice-v1';
  var box=document.getElementById('ae-notice');
  var seen=false;
  try{ seen = localStorage.getItem(K)==='seen'; }catch(e){}
  function open(){ box.classList.add('on'); }
  function close(){
    box.classList.remove('on');
    try{ localStorage.setItem(K,'seen'); }catch(e){}
  }
  document.getElementById('ae-notice-ok').addEventListener('click',close);
  document.getElementById('ae-notice-open').addEventListener('click',open);
  box.addEventListener('click',function(e){ if(e.target===box) close(); });
  if(!seen) open();
})();
</script>
<script>
/*
 * marketing/analytics.js — 匿名の到達計測（ファネル）
 * ===========================================================================
 * `docs/BUSINESS_CASE.md` §4 の課金率3%・ARPPU¥3,000 は**仮定**であって実測ではない。
 * 公開後に実データで置き換えるために、最低限これだけを数える。
 *
 *   1. 何人が来たか                  → /lp（LP）、/play（ゲーム）
 *   2. 何人が実際に遊び始めたか        → イベント start（主人公の名前を決めた）
 *   3. 何人が第1話を読み終えたか      → イベント ep1-clear
 *   4. 何人が2話目まで進んだか        → イベント ep2-clear
 *
 * ---------------------------------------------------------------------------
 * 設計方針（プライバシーポリシー §6 と一字一句対応させること）
 * ---------------------------------------------------------------------------
 * - **既定では一切の通信をしない。** 送信先 `` が
 *   空文字のままなら、このスクリプトは即座に return する。
 *   → 送信先を設定するまで、外部へ1バイトも出ない
 * - **Cookie を使わない。識別子を作らない。** ユーザーIDも端末IDも持たない
 * - **送るのは固定の文字列だけ。** リファラ・画面サイズ・クエリ文字列・
 *   ページタイトル・主人公名・会話の内容は**送らない**（送る項目を下の
 *   `ping()` に限定してあるので、コードを読めば全部わかる）
 * - **各イベントは1ブラウザにつき1回だけ。** 送信済みの印だけを
 *   `amour-eternel:metrics:v1` に置く（真偽値のみ。中身は下の `mark()` を参照）
 * - **オプトアウトを尊重する。** Do Not Track、GoatCounter 互換の `skipgc`、
 *   および本作のプライバシーポリシー上の停止ボタン
 *   （`amour-eternel:no-analytics`）のいずれかで完全に停止する
 *
 * ゲーム本体（`components/**`）には一切手を入れていない。
 * 進捗は端末に保存されたセーブ（`amour-eternel:save:v1`）を**読むだけ**で判定する。
 * ゲーム側の実装を汚さないための構造であって、本来は
 * ゲーム側から明示的にイベントを出すほうが正確である（`README.md` に記載）。
 */
(function () {
  'use strict';

  /** 送信先。build_site.py が置換する。空なら何もしない。 */
  var ENDPOINT = '';
  /** このページの識別（'lp' または 'play'）。build_site.py が置換する。 */
  var PAGE = 'play';

  if (!ENDPOINT || ENDPOINT.indexOf('__') === 0) return;

  var SAVE_KEY = 'amour-eternel:save:v1';
  var SENT_KEY = 'amour-eternel:metrics:v1';

  function ls() {
    try {
      return window.localStorage;
    } catch (e) {
      return null;
    }
  }

  // --- オプトアウト -------------------------------------------------------
  var store = ls();
  if (!store) return; // localStorage が使えない環境では計測しない（判定も保存もできないため）
  try {
    if (navigator.doNotTrack === '1' || window.doNotTrack === '1') return;
    if (store.getItem('amour-eternel:no-analytics') === 'yes') return;
    if (store.getItem('skipgc') === 't') return;
  } catch (e) {
    return;
  }

  function sent() {
    try {
      return JSON.parse(store.getItem(SENT_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function mark(key) {
    try {
      var s = sent();
      s[key] = 1;
      store.setItem(SENT_KEY, JSON.stringify(s));
    } catch (e) {
      /* 保存できなくても計測は続ける（重複するだけで害はない） */
    }
  }

  /**
   * 送信は 1x1 の画像取得1回だけ。fetch も XHR も使わない。
   * パラメータは GoatCounter の /count と同じ綴り（p=パス, e=イベント, rnd=キャッシュ避け）。
   * **r（リファラ）, s（画面サイズ）, q（クエリ）, t（タイトル）は意図的に送らない。**
   */
  function ping(path, isEvent) {
    var url =
      ENDPOINT +
      (ENDPOINT.indexOf('?') < 0 ? '?' : '&') +
      'p=' +
      encodeURIComponent(path) +
      (isEvent ? '&e=1' : '') +
      '&rnd=' +
      Math.random().toString(36).slice(2, 7);
    var img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.alt = '';
    img.src = url;
  }

  /** 1ブラウザにつき1回だけ送るイベント */
  function once(name) {
    if (sent()[name]) return;
    mark(name);
    ping(name, true);
  }

  // --- 到達（ページ表示） -------------------------------------------------
  ping('/' + PAGE, false);

  // --- ファネル（ゲーム側のセーブを読むだけ） -----------------------------
  if (PAGE !== 'play') return;

  function readSave() {
    try {
      var raw = store.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function checkFunnel() {
    var save = readSave();
    if (!save || typeof save !== 'object') return;
    if (typeof save.playerName === 'string' && save.playerName.length > 0) once('start');
    var cleared = Array.isArray(save.clearedEpisodes) ? save.clearedEpisodes.length : 0;
    if (cleared >= 1) once('ep1-clear');
    if (cleared >= 2) once('ep2-clear');
  }

  checkFunnel();
  setInterval(checkFunnel, 5000);
})();

</script>
